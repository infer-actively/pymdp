name: Nightly Tests

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      # Work around a jaxlib 0.10.2+ XLA:CPU bug (__ynn_fusion crash/hang on rank>=7
      # broadcast-multiply-reduce). See https://github.com/jax-ml/jax/issues/39257.
      # Remove once fixed upstream.
      XLA_FLAGS: --xla_cpu_experimental_ynn_fusion_type=
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg graphviz libgraphviz-dev pkg-config build-essential python3-dev
      - name: Install dependencies
        run: |
          uv sync --group test
      - name: Running nightly-marked tests
        run: |
          uv run pytest test -n 2 -m nightly
      - name: Running nightly-tier notebook tests
        run: |
          uv run python scripts/run_notebook_manifest.py test/notebooks/nightly_notebooks.txt
